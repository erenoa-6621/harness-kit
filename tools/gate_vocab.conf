# gate_vocab.conf — gate_check.sh の語彙。bash が source する（値は単引用符で囲んだ ERE）。
# 判定は小文字化した文字列に対して行う。多バイトの否定文字クラス [^。] は UTF-8 ロケールが前提
# （gate_check.sh 側でロケールを固定し、取れなければ「判定不能」で止まる）。
#
# ── 人間ゲート側（外部または人の目に触れる瞬間） ──
# publish ラベルの付与（引用符を落とした文字列に当てる）
GATE_LABEL_RE='(--add-label publish|label publish|publish ラベル|publishラベル|-l publish)'
# 本番デプロイ
GATE_DEPLOY_RE='(wrangler[[:space:]]+(pages[[:space:]]+)?deploy|vercel[[:space:]]+deploy|netlify[[:space:]]+deploy|(pages|workers)[[:space:]]*(へ|に)[[:space:]]*deploy|deploy[[:space:]]*(する|して)|本番へ?デプロイ|本番[^。]{0,40}(反映|反映する|上げる|上げ)|production[[:space:]]+deploy|デプロイする|本番[^。]{0,40}(リリース|出す|切り替え|切替|アップロード)|production[^。]{0,40}(反映|リリース|出す)|リリースする|リリースして)'
# 記事・成果物の公開
GATE_PUBLISH_RE='(記事を[^。]{0,40}(公開|publish)|を?publish[[:space:]]*(する|して)|公開する|公開して|(記事|ブログ|ポートフォリオ|資料|スライド)[^。]{0,20}(出す|アップ|載せる|上げる)|世に出す|一般公開)'
# リポジトリの可視性変更
GATE_VISIBILITY_RE='(gh[[:space:]]+repo[[:space:]]+edit.*visibility|--visibility[[:space:]]+public|public[[:space:]]*化|public[[:space:]]*(に|へ)[[:space:]]*(する|変え|切り替え))'
# 対外送信
GATE_SEND_RE='(gh[[:space:]]+(issue|pr)[[:space:]]+comment|クライアントへ|先方へ(送|連絡)|応募(文|する|を送)|提案文を送|メールを送|mail[[:space:]]+send|送信する|issue[^。]{0,20}(コメント|書き込)|pr[^。]{0,20}コメント|dm[^。]{0,20}(返信|送)|取引先[^。]{0,20}(送|請求)|請求書を送)'
# 外部アカウントからの発信
GATE_SNS_RE='(x[[:space:]]*(へ|に)[[:space:]]*(の)?投稿|tweet|ツイート|sns[[:space:]]*(へ|に)|note[[:space:]]*(へ|に)[^。]{0,20}(投稿|出す|アップ)|投稿する)'
# 納品
GATE_DELIVER_RE='(成果物を[^。]{0,20}(引き渡|渡す|納品)|検収[^。]{0,10}(へ|に)?[^。]{0,10}(回す|出す|依頼)|納品する|納品して)'
# 課金
GATE_BILLING_RE='(stripe|課金|決済|サブスクリプション|プラン[^。]{0,10}(変更|アップグレード|申し込|申込)|有料[^。]{0,10}(プラン|申し込|申込|契約)|subscribe|billing|アップグレードする)'
# 不可逆な削除・履歴の書き換え・資格情報の失効
GATE_DESTROY_RE='(push[[:space:]]+.*--force|--force-with-lease|filter-branch|filter-repo|rebase[[:space:]]+.*origin/main|gh[[:space:]]+repo[[:space:]]+delete|revoke|失効させ|トークンを(消|削除)|(リポジトリ|データベース|db|テーブル|バケット|bucket|本番[^。]{0,10})[^。]{0,10}(を)?[^。]{0,10}削除|(バケット|bucket)[^。]{0,10}空に|drop[[:space:]]+(database|table))'
# 再帰削除（一時領域なら裁量）
GATE_RMR_RE='rm[[:space:]]+-[a-z]*r'
GATE_TMP_RE='(/tmp/|\$tmpdir|scratchpad)'
#
# ── 配線（ワークフロー）の判定 ──
# 配線の語。これがあれば「変える」か「押す」かを分ける
GATE_WIRING_RE='(配線|ワークフロー|workflow|\.github|auto-merge|自動マージ|cron|crontab|マシン設定|パイプライン|定期実行|自動実行|時間窓|公開窓|承認の受け取り)'
# 公開・デプロイの語（この語があるものは既定で人間ゲート側に置く）
GATE_PUBWORD_RE='(publish|公開|deploy|デプロイ|リリース|release|本番|production)'
# 「変更」と明示的に読める語（これがあるときだけ配線の裁量に落とす）
GATE_CHANGE_RE='(変更|変える|変え|書き換え|書きかえ|直す|直し|修正|足す|追加|加える|削る|設定を|作り直|置き換え|移す|リファクタ|edit|update|modify|change|rewrite)'
# 発火（押す）と読める語。「変更」語があっても人間ゲートに倒す
GATE_FIRE_RE='(gh[[:space:]]+workflow[[:space:]]+run|workflow_dispatch|実行す|走らせ|起動す|動かす|叩く|押す|発火|トリガー|trigger|今すぐ|手で回す|kick)'
# cron・マシン設定（追加条件: バックアップと戻し方を残す）
GATE_MACHINE_RE='(cron|crontab|マシン設定)'
#
# ── 公開済み資産の内容更新（裁量） ──
GATE_PUBLISHED_RE='(公開済み|公開されている|既に公開|readme|リポジトリの説明|記事の(更新|修正|訂正)|誤字|リンク切れ|プレースホルダ)'
# 内容更新に見えても、可視性そのものの変更は人間ゲート
GATE_VISCHANGE_RE='(可視性|public[[:space:]]*化|private[[:space:]]*化|新規(に|の)?公開|初めて公開)'
#
# ── 判定できない外向きの語（人間ゲート扱い） ──
GATE_UNKNOWN_RE='(公開|納品|外部|対外)'
